name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm test

  integration:
    name: DB integration (migrate + restore-test + simulate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wit
          POSTGRES_PASSWORD: wit
          POSTGRES_DB: wit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wit:wit@localhost:5432/wit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Verify backup round trip
        run: npm run restore-test

      - name: Simulate the webhook pipeline end-to-end
        run: npm run simulate

      - name: Simulate the Groq AI pipeline (mock Groq) end-to-end
        run: npm run simulate:groq

      - name: Simulate the WiTNext broker (mock WiTNext) end-to-end
        run: npm run simulate:witnext
