# WiT Connect: authenticated Render deployment.
# Existing service: voip-1, Node runtime, Virginia. See docs/render-deployment.md.
# Preserve/verify its existing DATABASE_URL before attaching any new database.
services:
  - type: web
    name: voip-1
    runtime: node
    repo: https://github.com/Yothisislogan/voip
    branch: main
    region: virginia
    # Retain the existing free plan for setup. Approve always-on compute before
    # routing real calls; free services can sleep and are not a phone-service SLA.
    plan: free
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:render
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: DEV_LOGIN_ENABLED
        value: "false"
      - key: CSRF_ENABLED
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # Keep the existing session secret on an existing service. Generate a new
      # long random value only if none has been configured; never commit it.
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AGENT_DIRECTORY
        sync: false
      - key: DEFAULT_AGENT_IDENTITY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_TWIML_APP_SID
        sync: false
      - key: TWILIO_CALLER_ID
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: EMAIL_INBOUND_TOKEN
        sync: false
      - key: WITNEXT_URL
        sync: false
      - key: WITNEXT_INTEGRATION_ID
        sync: false
      - key: WITNEXT_INTEGRATION_SECRET
        sync: false
      - key: LEAD_SIGNAL_TOKEN
        sync: false
