<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WIT Connect — Sign in</title>
<style>
  :root{--blue:#00AEEF;--ink:#06121D;--paper:#F4F8FB;--line:#E3EBF1;--mute:#6B7280;--red:#FF6868}
  *{box-sizing:border-box;font-family:'IBM Plex Sans',-apple-system,system-ui,sans-serif}
  body{margin:0;background:var(--paper);color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{width:360px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 18px 40px rgba(6,18,29,.08);text-align:center}
  .logo{width:46px;height:46px;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:var(--mute);font-size:13px;margin:0 0 24px}
  a.google{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:600;color:var(--ink);background:#fff}
  a.google:hover{background:var(--paper)}
  .g{width:18px;height:18px}
  .err{background:#FFF3F3;border:1px solid #FFD4D4;color:#B42318;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:18px;text-align:left}
  .foot{margin-top:20px;font-size:11px;color:var(--mute)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">W</div>
    <h1>WIT Connect</h1>
    <p class="sub">Agent sign-in</p>
    <div id="err" class="err" style="display:none"></div>
    <a class="google" href="/auth/google">
      <svg class="g" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.1 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.8 6c1.9-5.6 7.1-9.8 13.7-9.8z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-4 6.8-9.9 6.8-17.4z"/><path fill="#FBBC05" d="M10.3 28.3c-.5-1.4-.7-2.9-.7-4.3s.3-2.9.7-4.3l-7.8-6C.9 16.9 0 20.3 0 24s.9 7.1 2.5 10.3l7.8-6z"/><path fill="#34A853" d="M24 48c6.1 0 11.3-2 15-5.5l-7.3-5.7c-2 1.4-4.7 2.3-7.7 2.3-6.6 0-11.8-4.2-13.7-9.8l-7.8 6C6.4 42.6 14.6 48 24 48z"/></svg>
      Sign in with Google
    </a>
    <div class="foot">Access is limited to authorized agents. A second factor is required.</div>
  </div>
<script>
  const errs = {
    not_authorized: "That Google account isn't an authorized agent.",
    google_not_configured: "Google sign-in isn't configured yet.",
    bad_state: "Sign-in expired or was tampered with. Try again.",
    auth_failed: "Sign-in failed. Please try again.",
    session_expired: "Your session expired. Please sign in again.",
    "2fa_send_failed": "Couldn't send your verification code. Try again."
  };
  const e = new URLSearchParams(location.search).get("error");
  if (e) { const box = document.getElementById("err"); box.textContent = errs[e] || "Sign-in error."; box.style.display = "block"; }
</script>
</body>
</html>
