<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WIT Connect — Agent Workspace</title>
<!-- Twilio Voice JS SDK v2 (validate latest release at sdk.twilio.com) -->
<script src="https://sdk.twilio.com/js/voice/releases/2.12.3/twilio.min.js"></script>
<style>
  :root{
    --blue:#00AEEF; --deep:#007EAE; --ink:#06121D; --paper:#F4F8FB;
    --line:#E3EBF1; --mute:#6B7280; --green:#33D17A; --red:#FF6868;
    --amber:#F5A623; --card:#fff;
  }
  *{box-sizing:border-box;font-family:'IBM Plex Sans',-apple-system,system-ui,sans-serif}
  body{margin:0;background:var(--paper);color:var(--ink);padding:24px}
  h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px}
  .top small{display:block;font-size:10px;letter-spacing:.06em;color:var(--mute)}
  .conn{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
  .dot{width:9px;height:9px;border-radius:99px;background:var(--mute)}
  .dot.on{background:var(--green)}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(6,18,29,.05)}
  .card + .card{margin-top:20px}
  .display{background:var(--paper);border-radius:12px;padding:14px;font-family:'IBM Plex Mono',monospace;font-size:22px;text-align:center;min-height:30px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .key{padding:14px 0;border:none;border-radius:12px;background:var(--paper);font-size:18px;font-weight:600;cursor:pointer;font-family:'IBM Plex Mono',monospace}
  .key:active{transform:scale(.96)}
  .actions{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;padding:13px 0;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
  .btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .call{background:var(--green)} .hang{background:var(--red)} .ghost{background:var(--paper);color:var(--ink)}
  .incoming{margin-top:14px;padding:12px;border-radius:12px;background:#E2F4FC;border:1px solid #BCE4F5;text-align:center;display:none}
  .incoming.show{display:block}
  .log{margin-top:12px;font-size:12px;color:var(--mute);text-align:center;min-height:16px}
  .hidden{display:none}
  /* CRM card */
  .crm-name{font-size:20px;font-weight:700}
  .crm-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
  .crm-row span:first-child{color:var(--mute)}
  .crm-link{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;color:var(--deep);text-decoration:none}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#E2F4FC;color:var(--deep)}
  .pill.new{background:#FFF1DB;color:#9A6400}
  /* Coaching cues */
  .cue{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--paper);margin-bottom:8px;border-left:4px solid var(--blue);animation:pop .25s ease}
  .cue.high{border-left-color:var(--red);background:#FFF3F3}
  .cue .lens{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);min-width:74px}
  .cue .txt{font-size:14px;line-height:1.35}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .senti{font-size:12px;color:var(--mute);margin-top:4px}
  .empty{color:var(--mute);font-size:13px}
  /* recap */
  .recap-field{margin:8px 0;font-size:14px}
  .recap-field b{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
  ul{margin:4px 0;padding-left:18px}
</style>
</head>
<body>
  <div class="top">
    <div class="logo">W</div>
    <div><b style="font-size:16px">WIT Connect</b><small>AGENT WORKSPACE</small></div>
    <div class="conn"><span class="dot" id="dot"></span><span id="state">Connecting…</span></div>
  </div>

  <div class="grid">
    <!-- ── Dialer ── -->
    <div>
      <div class="card">
        <h2>Softphone</h2>
        <div class="display" id="display">+1</div>
        <div class="pad" id="pad"></div>
        <div class="incoming" id="incoming">
          <div style="font-weight:700" id="callerId">Incoming call</div>
          <div class="actions">
            <button class="btn call" id="accept">Accept</button>
            <button class="btn hang" id="reject">Decline</button>
          </div>
        </div>
        <div class="actions">
          <button class="btn call" id="callBtn">Call</button>
          <button class="btn hang hidden" id="hangBtn">End</button>
          <button class="btn ghost hidden" id="muteBtn">Mute</button>
        </div>
        <div class="log" id="log"></div>
      </div>
    </div>

    <!-- ── Live CRM + coaching ── -->
    <div>
      <div class="card" aria-live="polite">
        <h2>Customer (SuiteCRM)</h2>
        <div id="crm"><div class="empty">No active call. The caller's CRM record appears here when a call connects.</div></div>
      </div>

      <div class="card">
        <h2>Live Coaching</h2>
        <div id="senti" class="senti"></div>
        <div id="cues" aria-live="polite"><div class="empty">Coaching cues appear here during the call.</div></div>
      </div>

      <div class="card hidden" id="recapCard">
        <h2>Call Recap</h2>
        <div id="recap"></div>
      </div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const display = $("display"), log = (m) => ($("log").textContent = m);
const params = new URLSearchParams(location.search);
const identity = params.get("identity") || "";

let device, activeCall = null, muted = false;

// ── Dial pad ──
"123456789*0#".split("").forEach((d) => {
  const b = document.createElement("button");
  b.className = "key"; b.textContent = d;
  b.onclick = () => {
    if (activeCall) { activeCall.sendDigits(d); return; }
    display.textContent = display.textContent + d;
  };
  $("pad").appendChild(b);
});

function setState(text, online){ $("state").textContent = text; $("dot").classList.toggle("on", !!online); }
function inCallUI(on){ $("callBtn").classList.toggle("hidden",on); $("hangBtn").classList.toggle("hidden",!on); $("muteBtn").classList.toggle("hidden",!on); }

// ── Twilio device ──
async function initDevice() {
  try {
    const res = await fetch(`/token${identity ? "?identity=" + encodeURIComponent(identity) : ""}`);
    const { token, identity: id } = await res.json();
    device = new Twilio.Device(token, { codecPreferences: ["opus", "pcmu"] });
    device.on("registered", () => setState(`Ready · ${id}`, true));
    device.on("error", (e) => { setState("Device error", false); log(e.message); });
    device.on("tokenWillExpire", async () => {
      try {
        const r = await fetch(`/token?identity=${encodeURIComponent(id)}`);
        device.updateToken((await r.json()).token);
      } catch { setState("Token refresh failed — reload", false); }
    });
    device.on("incoming", (call) => {
      activeCall = call;
      $("callerId").textContent = "Incoming · " + (call.parameters.From || "unknown");
      $("incoming").classList.add("show");
      call.on("disconnect", endCleanup);
      call.on("cancel", endCleanup);
    });
    await device.register();
  } catch {
    setState("Could not connect", false);
    log("Check the server is running and Twilio env vars are set.");
  }
}

function endCleanup(){ activeCall=null; muted=false; inCallUI(false); $("incoming").classList.remove("show"); $("muteBtn").textContent="Mute"; log("Call ended"); }

$("callBtn").onclick = async () => {
  const to = display.textContent.trim();
  if (!device || to.length < 4) return;
  log("Dialing " + to + "…");
  activeCall = await device.connect({ params: { To: to } });
  activeCall.on("accept", () => { inCallUI(true); log("Connected"); });
  activeCall.on("disconnect", endCleanup);
};
$("hangBtn").onclick = () => activeCall && activeCall.disconnect();
$("muteBtn").onclick = () => { if(!activeCall)return; muted=!muted; activeCall.mute(muted); $("muteBtn").textContent = muted?"Unmute":"Mute"; };
$("accept").onclick = () => { if(!activeCall)return; activeCall.accept(); inCallUI(true); $("incoming").classList.remove("show"); };
$("reject").onclick = () => { activeCall && activeCall.reject(); endCleanup(); };

// ── Real-time channel (screen-pop, coaching, recap) ──
function renderCRM(contact, phone){
  const el = $("crm");
  if (!contact) {
    el.innerHTML = `<div class="crm-name">New caller</div>
      <div class="senti">${phone || ""}</div>
      <span class="pill new">Not in CRM</span>`;
    return;
  }
  el.innerHTML = `
    <div class="crm-name">${esc(contact.fullName)}</div>
    ${contact.accountName ? `<div class="senti">${esc(contact.accountName)}</div>` : ""}
    <div style="margin-top:10px">
      ${row("Phone", contact.phone)}
      ${contact.email ? row("Email", contact.email) : ""}
      ${contact.title ? row("Title", contact.title) : ""}
    </div>
    ${contact.url ? `<a class="crm-link" href="${contact.url}" target="_blank" rel="noopener">Open in SuiteCRM →</a>` : ""}`;
}
function row(k,v){ return `<div class="crm-row"><span>${k}</span><span>${esc(v||"")}</span></div>`; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function renderCues(coaching){
  const el = $("cues");
  $("senti").textContent = coaching.customerSentiment ? `Customer sentiment: ${coaching.customerSentiment}` : "";
  if (!coaching.cues || !coaching.cues.length) return; // keep prior cues if nothing new
  el.innerHTML = "";
  for (const c of coaching.cues) {
    const div = document.createElement("div");
    div.className = "cue" + (c.priority === "high" ? " high" : "");
    div.innerHTML = `<span class="lens">${esc((c.lens||"").replace("_"," "))}</span><span class="txt">${esc(c.text)}</span>`;
    el.appendChild(div);
  }
}

function renderRecap(msg){
  const r = msg.recap; if (!r) return;
  $("recapCard").classList.remove("hidden");
  const list = (arr) => arr && arr.length ? `<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : "<div class='empty'>None</div>";
  $("recap").innerHTML = `
    <div class="recap-field"><b>Summary</b>${esc(r.summary)}</div>
    <div class="recap-field"><b>Outcome</b>${esc((r.outcome||"").replace(/_/g," "))} · sentiment ${esc(r.customerSentiment||"?")}</div>
    <div class="recap-field"><b>Products discussed</b>${list(r.productsDiscussed)}</div>
    <div class="recap-field"><b>Objections</b>${list(r.objections)}</div>
    <div class="recap-field"><b>Next steps</b>${list(r.nextSteps)}</div>
    ${r.followUpDate ? `<div class="recap-field"><b>Follow-up</b>${esc(r.followUpDate)}</div>` : ""}
    <div class="senti">${msg.savedToCrm ? "✓ Saved to SuiteCRM" : "Not saved to CRM (CRM disabled or contact not found)"}</div>`;
}

function connectWS(){
  if (!identity) return;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/agent?identity=${encodeURIComponent(identity)}`);
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === "screenpop") {
      renderCRM(msg.contact, msg.phone);
      $("recapCard").classList.add("hidden");      // clear last call's recap
      $("cues").innerHTML = "";
    } else if (msg.type === "coaching") {
      renderCues(msg);
    } else if (msg.type === "recap") {
      if (msg.contact) renderCRM(msg.contact, null);
      renderRecap(msg);
    }
  };
  ws.onclose = () => setTimeout(connectWS, 3000); // auto-reconnect
}

initDevice();
connectWS();
</script>
</body>
</html>
