<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WIT Connect — Leads &amp; Contacts</title>
<style>
  :root{--blue:#00AEEF;--deep:#007EAE;--purple:#7C3AED;--ink:#17181C;--mute:#6B7280;--line:#E6E7EB;--paper:#FAFAFB;--green:#39D353;--red:#E5484D;--amber:#F5A623}
  *{box-sizing:border-box;font-family:Inter,-apple-system,system-ui,sans-serif}
  body{margin:0;height:100vh;overflow:hidden;background:#fff;color:var(--ink);display:grid;grid-template-rows:56px 1fr}
  .top{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:900;display:grid;place-items:center}
  .top a{margin-left:auto;font-size:14px;font-weight:700;color:var(--deep);text-decoration:none}
  .main{display:grid;grid-template-columns:340px 1fr;min-height:0}
  .list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
  .search{padding:12px}
  .search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
  .rows{overflow:auto;min-height:0}
  .item{padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:hover{background:#F1F1F4}.item.active{background:#E2F4FC}
  .item .n{font-weight:800;font-size:14px}.item .m{font-size:12px;color:var(--mute)}
  .item .score{float:right;font-size:11px;font-weight:900;color:#fff;border-radius:99px;padding:2px 8px}
  .detail{overflow:auto;min-height:0;padding:22px}
  .empty{color:var(--mute);margin-top:20vh;text-align:center}
  h1{font-size:24px;margin:0 0 2px}.sub{color:var(--mute);font-size:14px}
  .form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px;max-width:720px}
  .f{display:flex;flex-direction:column}.f.full{grid-column:1/3}
  .f label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:800;margin-bottom:4px}
  .f input,.f select,.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px}
  .ro{background:#F7F7F9;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;min-height:38px}
  .bar{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn.ghost{background:var(--paper);color:#222;border:1px solid var(--line)}.btn.red{background:var(--red)}.btn.sm{padding:7px 10px;font-size:12px}
  .saved{color:#1B7F4B;font-size:13px;font-weight:700}
  .calls,.trackerBox{margin-top:24px;max-width:720px}
  .call{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;text-decoration:none;color:inherit}
  .call:hover{background:var(--paper)}
  .badge{font-size:11px;font-weight:900;color:#fff;border-radius:99px;padding:2px 9px}
  .trackerBox{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
  .trackerHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
  .trackerHead h3{margin:0 0 4px}.hint{font-size:12px;color:var(--mute);line-height:1.35}
  .trackerGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.trackerGrid .full{grid-column:1/3}
  .linkRow{display:flex;gap:8px}.linkRow input{flex:1;min-width:0}
  .pill{font-size:11px;font-weight:900;border-radius:99px;padding:3px 9px;color:#fff;background:var(--green);white-space:nowrap}.pill.off{background:var(--mute)}
  .history{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.event{font-size:12px;color:var(--mute);margin:4px 0}
</style>
</head>
<body>
  <div class="top"><div class="logo">W</div><b>Leads &amp; Contacts</b><a href="/agent.html">← Workspace</a></div>
  <div class="main">
    <div class="list">
      <div class="search"><input id="q" placeholder="Search name, phone, email, business…" autocomplete="off" /></div>
      <div class="rows" id="rows"><div class="empty">Loading…</div></div>
    </div>
    <div class="detail" id="detail"><div class="empty">Select a contact to view and edit.</div></div>
  </div>
<script>
const esc=s=>String(s==null?"":s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const scoreColor=n=>n>=70?"#1FA85A":n>=40?"#F5A623":"#E5484D";
const EDIT=[["first_name","First name"],["last_name","Last name"],["email","Email"],["company","Company"],["title","Title"],["policy_type","Policy type"],["carrier","Carrier"],["premium","Premium"],["policy_number","Policy #"],["renewal_date","Renewal date"],["coverage_status","Coverage status"]];
const STAGES=["lead","contact","customer","lost"];
let activeId=null;
let canEdit=true; // set from /auth/me — viewers are read-only
let trackerStatusOptions=[];

function csrfToken(){const m=document.cookie.match(/(?:^|;\s*)wit_csrf=([^;]+)/);return m?decodeURIComponent(m[1]):""}
async function api(path,opts={}){
  const method=(opts.method||"GET").toUpperCase();
  const headers={...(opts.headers||{})};
  if(method!=="GET"&&method!=="HEAD")headers["X-CSRF-Token"]=csrfToken();
  const r=await fetch(path,{credentials:"same-origin",...opts,headers});
  if(r.status===401){location.href="/login";throw new Error("unauth")}
  if(r.status===403)throw new Error("Not allowed for this role");
  if(r.status===503)throw new Error("CRM database not configured");
  return r;
}

async function search(){
  const q=document.getElementById("q").value.trim();
  const r=await api(`/api/crm/contacts?q=${encodeURIComponent(q)}&limit=100`);
  const {contacts}=await r.json();
  const el=document.getElementById("rows");
  if(!contacts.length){el.innerHTML="<div class='empty'>No contacts.</div>";return}
  el.innerHTML="";
  for(const c of contacts){
    const name=[c.first_name,c.last_name].filter(Boolean).join(" ")||c.business_name||c.phone_e164||"(no name)";
    const d=document.createElement("div");
    d.className="item"+(String(c.id)===String(activeId)?" active":"");
    d.innerHTML=`<div class="n">${esc(name)}</div><div class="m">${esc(c.phone_e164||c.email||"")} · ${esc(c.lifecycle_stage)}</div>`;
    d.onclick=()=>openContact(c.id);
    el.appendChild(d);
  }
}

async function openContact(id){
  activeId=id;
  [...document.querySelectorAll(".item")].forEach(x=>x.classList.remove("active"));
  const r=await api(`/api/crm/contacts/${id}`);
  const {contact,calls}=await r.json();
  const name=[contact.first_name,contact.last_name].filter(Boolean).join(" ")||contact.phone_e164;
  history.replaceState(null,"",`?id=${id}`);
  document.getElementById("detail").innerHTML=`
    <h1>${esc(name)}</h1><div class="sub">${esc(contact.phone_e164||"")}</div>
    <div class="form" id="form">
      ${EDIT.map(([k,label])=>`<div class="f"><label>${label}</label><input data-k="${k}" value="${esc(contact[k]??"")}"/></div>`).join("")}
      <div class="f"><label>Lifecycle stage</label><select data-k="lifecycle_stage">${STAGES.map(s=>`<option ${contact.lifecycle_stage===s?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="f full"><label>Address</label><input data-k="address" value="${esc(contact.address??"")}"/></div>
      <div class="f full"><label>Notes</label><textarea data-k="notes" rows="3">${esc(contact.notes??"")}</textarea></div>
      <div class="f"><label>VIN (extracted)</label><div class="ro">${esc(contact.vin||"—")}</div></div>
      <div class="f"><label>DOB (extracted)</label><div class="ro">${esc(fmtDate(contact.dob)||"—")}</div></div>
      <div class="f"><label>Vehicles (extracted)</label><div class="ro">${esc((contact.vehicles||[]).map(v=>`${v.year} ${v.make} ${v.model}`).join("; ")||"—")}</div></div>
      <div class="f"><label>Drivers (extracted)</label><div class="ro">${esc((contact.drivers||[]).join(", ")||"—")}</div></div>
      <div class="f"><label>Business (extracted)</label><div class="ro">${esc([contact.business_name,contact.business_type].filter(Boolean).join(" · ")||"—")}</div></div>
    </div>
    ${canEdit?`<div class="bar"><button class="btn" id="save">Save</button><button class="btn ghost" onclick="location.reload()">Reset</button><span class="saved" id="saved"></span></div>`:`<div class="bar"><span class="saved" style="color:#8a8f98">Read-only (viewer role)</span></div>`}
    <div class="trackerBox" id="trackerBox"><div class="hint">Loading case tracker…</div></div>
    <div class="calls"><h3>Recent calls</h3>${calls.length?calls.map(c=>`
      <a class="call" href="/call.html?sid=${encodeURIComponent(c.twilio_call_sid)}">
        <span>${esc(c.direction||"call")} · ${fmtDate(c.created_at)}</span>
        <span>${c.score!=null?`<span class="badge" style="background:${scoreColor(c.score)}">${c.score}</span>`:""} ${esc((c.outcome||"").replace(/_/g," "))}</span>
      </a>`).join(""):"<div class='empty' style='margin:10px 0'>No calls yet.</div>"}</div>`;
  if(canEdit){
    document.getElementById("save").onclick=()=>save(id);
  }else{
    document.querySelectorAll("#form [data-k]").forEach(el=>{el.setAttribute("disabled","");});
  }
  loadTracker(id, contact).catch(e=>{document.getElementById("trackerBox").innerHTML=`<div class="hint">${esc(e.message)}</div>`});
  search(); // refresh active highlight
}

async function save(id){
  const patch={};
  document.querySelectorAll("#form [data-k]").forEach(el=>{ patch[el.dataset.k]=el.value; });
  const r=await api(`/api/crm/contacts/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)});
  if(r.ok){document.getElementById("saved").textContent="✓ Saved";setTimeout(()=>document.getElementById("saved").textContent="",2000);}
}

async function loadTracker(contactId, contact){
  const r=await api(`/api/crm/contacts/${contactId}/tracker`);
  const data=await r.json();
  trackerStatusOptions=data.statusOptions||trackerStatusOptions;
  renderTracker(contactId, contact, data.tracker);
}

function trackerTitle(contact){
  const line=contact.policy_type||contact.business_type||"Insurance";
  return `${line} request status`;
}

function statusOptions(selected){
  return (trackerStatusOptions||[]).map(o=>`<option value="${esc(o.key)}" ${selected===o.key?"selected":""}>${esc(o.label)}</option>`).join("");
}

function renderTracker(contactId, contact, tracker){
  const el=document.getElementById("trackerBox");
  if(!tracker){
    el.innerHTML=`
      <div class="trackerHead"><div><h3>WIT Case Tracker</h3><div class="hint">Create a customer-facing smart link that only shows this prospect's case status.</div></div><span class="pill off">No link</span></div>
      ${canEdit?`<div class="trackerGrid">
        <div class="f full"><label>Public title</label><input id="trTitle" value="${esc(trackerTitle(contact))}" /></div>
        <div class="f"><label>Status</label><select id="trStatus">${statusOptions("request_received")}</select></div>
        <div class="f full"><label>Public note</label><textarea id="trNote" rows="3">We received your request and the WIT team is getting it moving.</textarea></div>
      </div><div class="bar"><button class="btn" onclick="createTracker(${Number(contactId)})">Create Smart Link</button><span class="saved" id="trSaved"></span></div>`:`<div class="hint">No tracker link has been created.</div>`}`;
    return;
  }
  const active=tracker.is_active!==false;
  el.innerHTML=`
    <div class="trackerHead"><div><h3>WIT Case Tracker</h3><div class="hint">Customer-facing link. It shows status only, not CRM notes, transcripts, or private application details.</div></div><span class="pill ${active?"":"off"}">${active?"Active":"Revoked"}</span></div>
    <div class="trackerGrid">
      <div class="f full"><label>Smart link</label><div class="linkRow"><input id="trUrl" value="${esc(tracker.url||"")}" readonly /><button class="btn ghost sm" onclick="copyTrackerLink()">Copy</button><button class="btn ghost sm" onclick="window.open(document.getElementById('trUrl').value,'_blank')">View</button></div></div>
      <div class="f full"><label>Public title</label><input id="trTitle" value="${esc(tracker.public_title||"")}" ${canEdit&&active?"":"disabled"}/></div>
      <div class="f"><label>Status</label><select id="trStatus" ${canEdit&&active?"":"disabled"}>${statusOptions(tracker.status)}</select></div>
      <div class="f full"><label>Public note</label><textarea id="trNote" rows="3" ${canEdit&&active?"":"disabled"}>${esc(tracker.public_note||"")}</textarea></div>
    </div>
    ${canEdit?`<div class="bar">${active?`<button class="btn" onclick="updateTracker(${Number(tracker.id)})">Update Status</button><button class="btn red" onclick="revokeTracker(${Number(tracker.id)},${Number(contactId)})">Revoke Link</button>`:`<button class="btn" onclick="createTracker(${Number(contactId)})">Create New Link</button>`}<span class="saved" id="trSaved"></span></div>`:""}
    <div class="history"><div class="hint"><b>Recent public updates</b></div>${(tracker.events||[]).slice(0,5).map(e=>`<div class="event">${fmtDate(e.created_at)} · ${esc(labelForStatus(e.status))}${e.event_type==="revoked"?" · revoked":""}</div>`).join("")||"<div class='event'>No status history yet.</div>"}</div>`;
}

function labelForStatus(status){const found=(trackerStatusOptions||[]).find(o=>o.key===status);return found?found.label:status}
async function createTracker(contactId){
  const body={public_title:document.getElementById("trTitle")?.value, status:document.getElementById("trStatus")?.value, public_note:document.getElementById("trNote")?.value};
  const r=await api(`/api/crm/contacts/${contactId}/tracker`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await r.json();
  trackerStatusOptions=data.statusOptions||trackerStatusOptions;
  renderTracker(contactId, {}, data.tracker);
  document.getElementById("trSaved").textContent="✓ Smart link created";
}
async function updateTracker(trackerId){
  const body={public_title:document.getElementById("trTitle")?.value, status:document.getElementById("trStatus")?.value, public_note:document.getElementById("trNote")?.value};
  const r=await api(`/api/crm/trackers/${trackerId}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.ok){document.getElementById("trSaved").textContent="✓ Tracker updated";setTimeout(()=>document.getElementById("trSaved").textContent="",2000);}
}
async function revokeTracker(trackerId, contactId){
  if(!confirm("Revoke this customer smart link?"))return;
  await api(`/api/crm/trackers/${trackerId}/revoke`,{method:"POST"});
  await loadTracker(contactId, {});
}
async function copyTrackerLink(){
  const input=document.getElementById("trUrl");
  if(!input)return;
  try{await navigator.clipboard.writeText(input.value)}catch{input.select();document.execCommand("copy")}
  const s=document.getElementById("trSaved"); if(s){s.textContent="✓ Link copied";setTimeout(()=>s.textContent="",1800)}
}

function fmtDate(d){if(!d)return "";try{return new Date(d).toLocaleDateString()}catch{return String(d)}}

let timer;document.getElementById("q").oninput=()=>{clearTimeout(timer);timer=setTimeout(search,250)};
// Learn the signed-in role first so the detail pane renders read-only for viewers.
fetch("/auth/me",{credentials:"same-origin"}).then(r=>r.ok?r.json():null).then(me=>{canEdit=!me||me.role!=="viewer";}).catch(()=>{}).finally(()=>{
  search().then(()=>{const id=new URLSearchParams(location.search).get("id");if(id)openContact(id)}).catch(e=>{document.getElementById("rows").innerHTML=`<div class='empty'>${esc(e.message)}</div>`});
});
</script>
</body>
</html>
