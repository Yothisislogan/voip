<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WiT Connect · Shared screen</title><link rel="stylesheet" href="/phone.css"><script defer src="/rtc-session.js"></script><script defer src="/share.js"></script></head><body class="share-page"><header><span class="brand"><b>WiT</b> CONNECT</span><span>View a shared screen</span></header><main class="share-main"><section class="panel"><h1>Join a screen share</h1><p>Your agent will approve your request. This page only displays their screen; it does not access your camera, microphone or screen.</p><form id="joinForm"><label>Your name<input id="visitorName" maxlength="60" autocomplete="name" required></label><button id="join" class="primary">Request to view</button></form><p id="shareStatus" role="status">Keep your call open to speak with your agent.</p><video id="sharedScreen" autoplay playsinline muted controls hidden></video><button id="leave" hidden>Leave screen share</button></section></main></body></html>
